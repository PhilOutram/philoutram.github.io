<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Family Games">
  <rect width="512" height="512" rx="96" fill="#0f172a" />
  <g transform="translate(116 116)">
    <!-- Nine cells: the shared grid, with a few already claimed by different players. -->
    <g fill="#16233c">
      <rect x="0" y="0" width="84" height="84" rx="12" />
      <rect x="98" y="0" width="84" height="84" rx="12" />
      <rect x="196" y="0" width="84" height="84" rx="12" />
      <rect x="0" y="98" width="84" height="84" rx="12" />
      <rect x="98" y="98" width="84" height="84" rx="12" />
      <rect x="196" y="98" width="84" height="84" rx="12" />
      <rect x="0" y="196" width="84" height="84" rx="12" />
      <rect x="98" y="196" width="84" height="84" rx="12" />
      <rect x="196" y="196" width="84" height="84" rx="12" />
    </g>
    <rect x="98" y="0" width="84" height="84" rx="12" fill="#38bdf8" opacity="0.22" />
    <rect x="0" y="98" width="84" height="84" rx="12" fill="#f472b6" opacity="0.22" />
    <rect x="196" y="196" width="84" height="84" rx="12" fill="#4ade80" opacity="0.22" />
    <g font-family="system-ui, sans-serif" font-size="58" font-weight="700"
       text-anchor="middle" dominant-baseline="central">
      <text x="140" y="44" fill="#38bdf8">7</text>
      <text x="42" y="142" fill="#f472b6">3</text>
      <text x="238" y="240" fill="#4ade80">5</text>
    </g>
  </g>
</svg>
