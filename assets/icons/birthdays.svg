<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Birthdays icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8" />
      <stop offset="1" stop-color="#efdfc8" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Watercolour blooms, echoing the calendar's per-person washes. -->
  <g filter="url(#soft)" opacity="0.5" style="mix-blend-mode:multiply">
    <circle cx="196" cy="222" r="88" fill="#e0a3a3" />
    <circle cx="312" cy="244" r="80" fill="#9fbcd8" />
    <circle cx="256" cy="330" r="84" fill="#e3c78d" />
  </g>

  <g fill="#a05f3f">
    <rect x="132" y="300" width="248" height="120" rx="24" />
    <rect x="132" y="276" width="248" height="42" rx="21" opacity="0.75" />
    <rect x="247" y="200" width="18" height="84" rx="9" />
    <path d="M256 150c20 24 27 36 27 49a27 27 0 0 1-54 0c0-13 7-25 27-49z" />
  </g>
</svg>
