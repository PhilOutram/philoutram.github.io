<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Uke Box icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
    <!-- Sound hole knocked out of the silhouette. -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800">
      <rect x="-400" y="-400" width="800" height="800" fill="#fff" />
      <circle cx="0" cy="112" r="25" fill="#000" />
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Ukulele, drawn upright (neck up) then tilted 45 degrees. -->
  <g transform="translate(256 256) rotate(45) scale(1) translate(0 -23)" fill="#0f172a">
    <g mask="url(#cut)">
      <!-- Body: small figure-of-eight, upper bout narrower than the lower -->
      <path d="M0,10 C40,10 60,38 60,68 C60,94 48,104 48,118 C48,132 80,142 80,174
               C80,222 44,252 0,252 C-44,252 -80,222 -80,174 C-80,142 -48,132 -48,118
               C-48,104 -60,94 -60,68 C-60,38 -40,10 0,10 Z" />
      <!-- Neck: short and broad -->
      <rect x="-14" y="-150" width="28" height="168" rx="5" />
      <!-- Headstock with two tuning pegs a side -->
      <rect x="-23" y="-205" width="46" height="66" rx="13" />
      <circle cx="-30" cy="-188" r="9" />
      <circle cx="-30" cy="-160" r="9" />
      <circle cx="30" cy="-188" r="9" />
      <circle cx="30" cy="-160" r="9" />
    </g>
  </g>
</svg>
